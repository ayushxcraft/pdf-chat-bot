<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Chat</title>
<style>
  :root {
    --bg: #f3f4f7;
    --panel: #ffffff;
    --ink: #111214;
    --muted: #6b7078;
    --line: #e4e6eb;
    --accent: #f5b921;
    --accent-ink: #1b1400;
    --rail: #0b0b0c;
    --bubble-user: #111214;
    --bubble-bot: #ffffff;
    --danger: #d8453b;
    --ok: #2e9e5b;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #202226; --ink: #f1f2f4; --muted: #9aa0a9; --line: #31343a;
      --bubble-user: #f5b921; --bubble-bot: #2a2d33;
    }
    .msg.user .bubble { color: #1b1400; }
  }
  * { box-sizing: border-box; }
  /* Keep hidden sections hidden even when component CSS sets display. */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  .app { display: grid; grid-template-columns: 72px 300px 1fr; height: 100vh; }

  /* rail */
  .rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 10px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; margin-bottom: 14px; }
  .rail button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #cfd2d8; display: grid; place-items: center; }
  .rail button:hover { background: #1c1d20; }
  .rail button.active { background: #232428; color: #fff; }
  .rail .spacer { flex: 1; }
  .rail svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* sidebar */
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 16px; min-width: 0; }
  .brand { font-weight: 800; letter-spacing: .02em; font-size: 17px; margin: 0 4px 16px; }
  .search { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--ink); font: inherit; outline: none; }
  .search:focus { border-color: var(--ink); }
  .btn-new { margin: 14px 0 18px; width: 100%; padding: 13px; border: 0; border-radius: 14px; background: var(--ink); color: var(--panel); font-weight: 600; }
  .btn-new:hover { opacity: .88; }
  .group { font-size: 12px; font-weight: 700; margin: 6px 4px 8px; color: var(--ink); }
  .docs { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; margin: 0 -4px; padding: 0 4px; }
  .doc { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; }
  .doc:hover { background: var(--bg); }
  .doc.active { background: var(--bg); font-weight: 600; }
  .doc .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc .del { opacity: 0; border: 0; background: transparent; color: var(--muted); padding: 2px 6px; border-radius: 6px; font-size: 16px; line-height: 1; }
  .doc:hover .del { opacity: 1; }
  .doc .del:hover { color: var(--danger); }
  .empty-docs { color: var(--muted); font-size: 13px; padding: 8px 6px; line-height: 1.5; }
  .side-foot { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .link-btn { border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 9px; font-size: 13px; color: var(--muted); }
  .link-btn:hover { color: var(--ink); border-color: var(--ink); }

  /* main */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { background: var(--panel); display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--rail); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 12px; position: relative; flex: none; }
  .avatar::after { content: ""; position: absolute; right: 0; bottom: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); }
  .top-title { font-weight: 700; }
  .top-sub { font-size: 13px; color: var(--muted); }
  .top-actions { margin-left: auto; display: flex; gap: 10px; }
  .pill { border: 1px solid var(--line); background: transparent; border-radius: 12px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
  .pill:hover { background: var(--bg); }
  .banner { background: var(--bg); text-align: center; padding: 10px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .banner b { text-decoration: underline; }

  .workspace { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .workspace.no-pdf { grid-template-columns: 1fr; }
  .workspace.no-pdf .viewer { display: none; }

  .viewer { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 16px; }
  .viewer-frame { flex: 1; border-radius: 12px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; min-height: 0; }
  .viewer-frame iframe { width: 100%; height: 100%; border: 0; }
  .placeholder { color: var(--muted); text-align: center; padding: 24px; max-width: 320px; line-height: 1.5; }

  .chat-col { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
  .msg { display: flex; gap: 10px; max-width: 92%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .mini { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--rail); color: var(--accent); }
  .msg.user .mini { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .bubble { padding: 14px 18px; border-radius: 18px; line-height: 1.55; overflow-wrap: anywhere; }
  .msg.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--line); border-top-left-radius: 6px; }
  .msg.user .bubble { background: var(--bubble-user); color: #fff; border-top-right-radius: 6px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin: 0; }
  .bubble ul { margin: 6px 0; padding-left: 20px; }
  .bubble code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 5px; font-size: .9em; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .msg.user .meta { justify-content: flex-end; }
  .src { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 11.5px; }
  .copy { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 0; }
  .copy:hover { color: var(--ink); }
  .msg.error .bubble { border-color: var(--danger); color: var(--danger); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

  .suggest { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .suggest button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 13px; font-size: 13px; }
  .suggest button:hover { border-color: var(--ink); }

  .composer { padding: 14px 24px 20px; display: flex; gap: 12px; align-items: center; }
  .clear { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 20px; flex: none; }
  .clear:hover { filter: brightness(.95); }
  .input-wrap { flex: 1; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 20px; }
  .input-wrap:focus-within { border-color: var(--ink); }
  .input-wrap input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); padding: 8px 0; min-width: 0; }
  .send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: var(--panel); display: grid; place-items: center; }
  .send:disabled { opacity: .35; cursor: not-allowed; }
  .send svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* welcome / dropzone */
  .welcome { flex: 1; display: grid; place-items: center; padding: 24px; }
  .drop { width: min(560px, 100%); border: 2px dashed var(--line); background: var(--panel); border-radius: 24px; padding: 48px 28px; text-align: center; transition: .15s; }
  .drop.over { border-color: var(--accent); background: rgba(245,185,33,.08); }
  .drop h2 { margin: 12px 0 6px; font-size: 22px; }
  .drop p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  .drop .big { font-size: 40px; }
  .cta { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 13px 24px; border-radius: 14px; }
  .cta:hover { filter: brightness(.95); }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; place-items: center; z-index: 50; }
  .overlay.show { display: grid; }
  .card { background: var(--panel); padding: 28px 34px; border-radius: 20px; text-align: center; min-width: 280px; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel); padding: 12px 18px; border-radius: 12px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.err { background: var(--danger); color: #fff; }


  /* Private app password gate */

  .mobile-only { display: none; }
  @media (max-width: 1100px) {
    .workspace { grid-template-columns: 1fr; }
    .viewer { display: none; }
    .workspace.show-pdf .viewer { display: flex; }
    .workspace.show-pdf .chat-col { display: none; }
    .mobile-only { display: inline-block; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }
    .side { position: fixed; inset: 0 25% 0 0; z-index: 40; transform: translateX(-100%); transition: .2s; min-width: 260px; }
    .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); }
    .topbar { padding: 12px 14px; }
    .messages, .composer { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div class="app">

  <nav class="rail">
    <div class="logo">PDF</div>
    <button class="active" title="Chats" aria-label="Chats"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
    <button id="railUpload" title="Upload PDF" aria-label="Upload PDF"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></button>
    <div class="spacer"></div>
    <button id="railSetup" title="Initialise database" aria-label="Initialise database"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></button>
  </nav>

  <aside class="side" id="side">
    <div class="brand">PDF CHAT</div>
    <input class="search" id="search" type="search" placeholder="Search documents" aria-label="Search documents">
    <button class="btn-new" id="btnNew">+ New document</button>
    <div class="group">YOUR DOCUMENTS</div>
    <div class="docs" id="docs"></div>
    <div class="side-foot">
      <button class="link-btn" id="btnSetup">Initialise database (run once)</button>
    </div>
  </aside>

  <section class="main">
    <header class="topbar">
      <button class="pill mobile-only" id="btnMenu" aria-label="Menu">☰</button>
      <div class="avatar">PDF</div>
      <div>
        <div class="top-title">PDF Chat Bot</div>
        <div class="top-sub" id="topSub">No document selected</div>
      </div>
      <div class="top-actions">
        <button class="pill mobile-only" id="btnToggle">View PDF</button>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>

    <div id="welcome" class="welcome">
      <div class="drop" id="drop">
        <div class="big">📄</div>
        <h2>Chat with your PDF</h2>
        <p>Drop a PDF here (max 20 MB). I'll index it, then you can ask anything about it. Answers come only from the document.</p>
        <button class="cta" id="btnPick">Choose a PDF</button>
      </div>
    </div>

    <div id="workspace" class="workspace" hidden>
      <div class="viewer">
        <div class="viewer-frame" id="viewerFrame"></div>
      </div>
      <div class="chat-col">
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="form">
          <button type="button" class="clear" id="btnClear" title="Clear chat" aria-label="Clear chat">🧹</button>
          <div class="input-wrap">
            <input id="q" type="text" placeholder="Ask any question about your document" autocomplete="off" maxlength="1000">
            <button class="send" id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
          </div>
        </form>
      </div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<div class="overlay" id="overlay"><div class="card"><div class="spinner"></div><div id="overlayText">Indexing your PDF…</div><div class="top-sub" style="margin-top:6px">Large files can take a minute.</div></div></div>
<div class="toast" id="toast"></div>

<script type="module">
  try {
    const { upload } = await import('https://esm.sh/@vercel/blob@2.8.2/client?bundle');
    window.pdfChatBlobUpload = upload;
    window.dispatchEvent(new Event('pdfchat-blob-sdk-ready'));
  } catch (error) {
    window.pdfChatBlobSdkError = error;
    window.dispatchEvent(new Event('pdfchat-blob-sdk-error'));
  }
</script>


<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MAX_BYTES = 20 * 1024 * 1024;
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  let docs = store.get('pdfrag.docs', []);       // [{docId, name, chunks, createdAt}]
  let chats = store.get('pdfrag.chats', {});     // {docId: [{role, text, sources, time, error}]}
  let activeId = store.get('pdfrag.active', null);
  const blobs = {};                               // docId -> object URL (this session only)
  let busy = false;

  const save = () => { store.set('pdfrag.docs', docs); store.set('pdfrag.chats', chats); store.set('pdfrag.active', activeId); };
  const activeDoc = () => docs.find((d) => d.docId === activeId);
  const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function toast(msg, isErr) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => (t.className = 'toast'), 3500);
  }

  // ---- safe, minimal markdown ----
  function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function render(text) {
    const out = []; let list = false;
    for (const line of text.split('\n')) {
      const m = line.match(/^\s*[-*•]\s+(.*)/);
      if (m) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(m[1]) + '</li>'); }
      else {
        if (list) { out.push('</ul>'); list = false; }
        if (line.trim()) out.push('<p>' + inline(line) + '</p>');
      }
    }
    if (list) out.push('</ul>');
    return out.join('');
  }

  // ---- sidebar ----
  function renderDocs() {
    const q = $('search').value.trim().toLowerCase();
    const list = docs.filter((d) => d.name.toLowerCase().includes(q));
    const el = $('docs');
    el.innerHTML = '';
    if (!list.length) {
      el.innerHTML = '<div class="empty-docs">' + (docs.length ? 'No matches.' : 'No documents yet. Upload a PDF to get started.') + '</div>';
      return;
    }
    for (const d of list) {
      const b = document.createElement('button');
      b.className = 'doc' + (d.docId === activeId ? ' active' : '');
      b.innerHTML = '<span>📄</span><span class="name"></span><span class="del" role="button" title="Remove from list" tabindex="0">×</span>';
      b.querySelector('.name').textContent = d.name;
      b.title = d.name + ' · ' + d.chunks + ' chunks';
      b.onclick = (e) => {
        if (e.target.classList.contains('del')) { removeDoc(d.docId); return; }
        selectDoc(d.docId); $('side').classList.remove('open');
      };
      el.appendChild(b);
    }
  }

  function removeDoc(id) {
    if (!confirm("Remove this document from this browser's list? Its PDF remains in private Blob storage and its vectors remain in Qdrant.")) return;
    docs = docs.filter((d) => d.docId !== id);
    delete chats[id];
    if (blobs[id]) { URL.revokeObjectURL(blobs[id]); delete blobs[id]; }
    if (activeId === id) activeId = docs[0]?.docId ?? null;
    save(); refresh();
  }

  function selectDoc(id) { activeId = id; save(); refresh(); }

  // Return to the upload screen without removing any previously uploaded documents.
  function startNewDocument() {
    activeId = null;
    save();
    refresh();
    $('side').classList.remove('open');
  }

  // ---- views ----
  function refresh() {
    renderDocs();
    const d = activeDoc();
    $('welcome').hidden = !!d;
    $('workspace').hidden = !d;
    $('banner').hidden = !d;
    $('topSub').textContent = d ? d.chunks + ' chunks indexed' : 'No document selected';
    if (!d) return;
    $('banner').innerHTML = 'Ask me about <span></span>';
    $('banner').querySelector('span').textContent = d.name;
    renderViewer(d);
    renderMessages();
    $('workspace').classList.remove('show-pdf');
    $('btnToggle').textContent = 'View PDF';
    $('q').focus();
  }

  function renderViewer(d) {
    const f = $('viewerFrame');
    f.innerHTML = '';
    const ws = $('workspace');

    if (blobs[d.docId]) {
      const ifr = document.createElement('iframe');
      ifr.src = blobs[d.docId];
      ifr.title = d.name;
      f.appendChild(ifr);
      ws.classList.remove('no-pdf');
      return;
    }

    if (d.pathname) {
      const ifr = document.createElement('iframe');
      ifr.src = '/pdf-preview?pathname=' + encodeURIComponent(d.pathname);
      ifr.title = d.name;
      f.appendChild(ifr);
      ws.classList.remove('no-pdf');
      return;
    }

    f.innerHTML = '<div class="placeholder">PDF preview is unavailable for this older document. You can still ask questions about <b></b>.</div>';
    f.querySelector('b').textContent = d.name;
    ws.classList.add('no-pdf');
  }

  const SUGGESTIONS = ['Summarise this document', 'What are the key points?', 'Who are the authors or main people mentioned?'];

  function msgNode(m) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot') + (m.error ? ' error' : '');
    const mini = document.createElement('div');
    mini.className = 'mini'; mini.textContent = m.role === 'user' ? 'You' : 'AI';
    const col = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = m.typing ? '<span class="typing"><i></i><i></i><i></i></span>' : render(m.text);
    col.appendChild(bubble);
    if (!m.typing) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = '<span>' + fmtTime(m.time) + '</span>';
      if (m.sources?.length) {
        for (const s of m.sources) {
          const c = document.createElement('span');
          c.className = 'src';
          c.title = 'Similarity ' + (s.score ?? 0).toFixed(3);
          c.textContent = 'chunk ' + s.chunkIndex + (typeof s.score === 'number' ? ' · ' + Math.round(s.score * 100) + '%' : '');
          meta.appendChild(c);
        }
      }
      if (m.role !== 'user' && !m.error) {
        const cp = document.createElement('button');
        cp.className = 'copy'; cp.type = 'button'; cp.textContent = 'Copy';
        cp.onclick = () => navigator.clipboard.writeText(m.text).then(() => toast('Copied'));
        meta.appendChild(cp);
      }
      col.appendChild(meta);
    }
    wrap.append(mini, col);
    return wrap;
  }

  function renderMessages() {
    const box = $('messages');
    box.innerHTML = '';
    const list = chats[activeId] || [];
    if (!list.length) {
      const hello = { role: 'bot', time: Date.now(), text: "Hello, I'm your document assistant. Ask me anything about **" + (activeDoc()?.name || 'your PDF') + "**. I'll answer only from what's in the document." };
      const n = msgNode(hello);
      const sg = document.createElement('div');
      sg.className = 'suggest';
      for (const s of SUGGESTIONS) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
        b.onclick = () => ask(s);
        sg.appendChild(b);
      }
      n.children[1].appendChild(sg);
      box.appendChild(n);
    }
    for (const m of list) box.appendChild(msgNode(m));
    box.scrollTop = box.scrollHeight;
  }

  // ---- api ----
  async function api(path, opts) {
    const res = await fetch(path, opts);
    const ct = res.headers.get('content-type') || '';
    const body = ct.includes('json') ? await res.json() : await res.text();

    if (!res.ok) {
      throw new Error((body && body.error) || body || ('HTTP ' + res.status));
    }

    return body;
  }

  function getBlobUploader() {
    if (typeof window.pdfChatBlobUpload === 'function') {
      return Promise.resolve(window.pdfChatBlobUpload);
    }
    if (window.pdfChatBlobSdkError) {
      return Promise.reject(new Error('The secure upload library could not load. Check your internet connection and reload the page.'));
    }

    return new Promise((resolve, reject) => {
      const cleanup = () => {
        window.removeEventListener('pdfchat-blob-sdk-ready', onReady);
        window.removeEventListener('pdfchat-blob-sdk-error', onError);
        clearTimeout(timeout);
      };
      const onReady = () => {
        cleanup();
        resolve(window.pdfChatBlobUpload);
      };
      const onError = () => {
        cleanup();
        reject(new Error('The secure upload library could not load. Check your internet connection and reload the page.'));
      };
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Timed out loading the secure upload library. Reload the page and try again.'));
      }, 15000);

      window.addEventListener('pdfchat-blob-sdk-ready', onReady, { once: true });
      window.addEventListener('pdfchat-blob-sdk-error', onError, { once: true });
    });
  }

  async function uploadFile(file) {
    if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      return toast('Please choose a PDF file', true);
    }
    if (file.size > MAX_BYTES) return toast('File is larger than 20 MB', true);

    $('overlayText').textContent = 'Preparing secure upload…';
    $('overlay').classList.add('show');

    try {
      const uploadToBlob = await getBlobUploader();
      // Keep the storage path independent of the original filename. The
      // backend only allows safe UUID-style names under pdf-chat/.
      const uploadId = window.crypto?.randomUUID
        ? window.crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      const pathname = `pdf-chat/${uploadId}.pdf`;

      // Confirm server-side environment variables before asking Blob for a token.
      const health = await api('/api/health');
      if (!health.config?.blobConfigured) {
        throw new Error('BLOB_READ_WRITE_TOKEN is missing. Add it to server/.env and restart the backend.');
      }
      if (!health.config?.geminiConfigured) {
        throw new Error('GEMINI_API_KEY is missing from server/.env.');
      }
      if (!health.config?.qdrantConfigured) {
        throw new Error('QDRANT_URL or QDRANT_API_KEY is missing from server/.env.');
      }

      const storedBlob = await uploadToBlob(pathname, file, {
        access: 'private',
        handleUploadUrl: '/api/blob-upload',
        contentType: 'application/pdf',
        multipart: true,
        clientPayload: JSON.stringify({ originalName: file.name }),
        onUploadProgress: ({ percentage }) => {
          $('overlayText').textContent = `Uploading PDF to secure storage… ${Math.round(percentage)}%`;
        },
      });

      $('overlayText').textContent = 'Upload complete. Extracting text and indexing…';

      const r = await api('/process-upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pathname: storedBlob.pathname,
          originalName: file.name,
        }),
      });

      docs.unshift({
        docId: r.docId,
        name: file.name,
        chunks: r.chunks,
        createdAt: Date.now(),
        pathname: r.pathname,
      });

      // Use a local object URL for the current session; /pdf-preview
      // reloads the stored private PDF after a page refresh.
      blobs[r.docId] = URL.createObjectURL(file);
      chats[r.docId] = [];
      activeId = r.docId;
      save();
      refresh();
      toast('Indexed ' + r.chunks + ' chunks');
    } catch (e) {
      console.error('PDF upload/indexing failed:', e);
      let message = e.message || 'Unexpected upload error.';
      if (/failed to retrieve the client token/i.test(message)) {
        message = 'Blob token request was rejected. Check the backend terminal for “Blob upload handshake error”. Also open /api/health and confirm config.blobConfigured is true.';
      }
      toast('Upload failed: ' + message, true);
    } finally {
      $('overlay').classList.remove('show');
      $('overlayText').textContent = 'Indexing your PDF…';
      $('file').value = '';
    }
  }

  async function ask(question) {
    question = (question || '').trim();
    if (!question || busy || !activeId) return;
    busy = true; $('send').disabled = true; $('q').value = '';
    const id = activeId;
    const list = (chats[id] ||= []);
    list.push({ role: 'user', text: question, time: Date.now() });
    renderMessages();
    const typing = msgNode({ role: 'bot', typing: true });
    $('messages').appendChild(typing);
    $('messages').scrollTop = $('messages').scrollHeight;
    try {
      const r = await api('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, docId: id }),
      });
      list.push({ role: 'bot', text: r.answer || '(empty answer)', sources: r.sources, time: Date.now() });
    } catch (e) {
      list.push({ role: 'bot', text: e.message, error: true, time: Date.now() });
    } finally {
      busy = false; $('send').disabled = false; save();
      if (activeId === id) renderMessages();
      $('q').focus();
    }
  }

  async function setup() {
    try {
      const msg = await api('/create-collection');
      toast(typeof msg === 'string' ? msg : 'Database ready');
    } catch (e) { toast('Setup failed: ' + e.message, true); }
  }

  // ---- events ----
  const pick = () => $('file').click();
  $('btnPick').onclick = pick; $('btnNew').onclick = startNewDocument; $('railUpload').onclick = pick;
  $('file').onchange = (e) => uploadFile(e.target.files[0]);
  $('btnSetup').onclick = setup; $('railSetup').onclick = setup;
  $('search').oninput = renderDocs;
  $('form').onsubmit = (e) => { e.preventDefault(); ask($('q').value); };
  $('btnClear').onclick = () => {
    if (!activeId || !(chats[activeId] || []).length) return;
    if (confirm('Clear this conversation?')) { chats[activeId] = []; save(); renderMessages(); }
  };
  $('btnMenu').onclick = () => $('side').classList.toggle('open');
  $('btnToggle').onclick = () => {
    const ws = $('workspace'); ws.classList.toggle('show-pdf');
    $('btnToggle').textContent = ws.classList.contains('show-pdf') ? 'View chat' : 'View PDF';
  };

  // drag & drop anywhere
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach((ev) => window.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => window.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement) drop.classList.remove('over'); }));
  window.addEventListener('drop', (e) => uploadFile(e.dataTransfer?.files?.[0]));

  if (!activeDoc()) activeId = docs[0]?.docId ?? null;
  refresh();
})();
</script>

</body>
</html>
